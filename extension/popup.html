<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="header-text">
      <h1 data-i18n="popup.title"></h1>
      <p class="caption" data-i18n="popup.caption"></p>
    </div>
    <button id="settings" type="button" class="icon-btn" data-i18n-title="popup.settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
    </button>
  </header>

  <section id="update" class="banner info update" hidden></section>

  <form id="form" class="composer">
    <textarea id="input" rows="3" autofocus data-i18n-placeholder="popup.placeholder"></textarea>
    <div class="row">
      <span class="hint"><kbd>Enter</kbd> <span data-i18n="popup.hintSubmit"></span> · <kbd>Shift</kbd>+<kbd>Enter</kbd> <span data-i18n="popup.hintNewline"></span></span>
      <button id="submit" type="submit" class="btn btn-primary" data-i18n="popup.submit"></button>
    </div>
  </form>

  <section id="status" class="banner" role="status" hidden></section>

  <section id="preview" class="preview" hidden>
    <div id="groups"></div>
    <div class="row end">
      <button id="cancel" type="button" class="btn btn-secondary" data-i18n="common.cancel"></button>
      <button id="apply" type="button" class="btn btn-primary"></button>
    </div>
  </section>

  <!-- This week's events (list or calendar, chosen on the settings page) -->
  <!-- 이번 주 일정 (목록 또는 캘린더, 설정 페이지에서 선택) -->
  <section id="week" class="week" hidden>
    <div class="week-head">
      <h2 class="section-label" id="week-title"></h2>
      <!-- Move between weeks / 주 이동 -->
      <div class="week-nav">
        <button id="week-prev" type="button" class="icon-btn small flip" data-i18n-title="popup.week.goPrev"></button>
        <button id="week-today" type="button" class="btn btn-secondary btn-small" data-i18n="popup.week.goToday" hidden></button>
        <button id="week-next" type="button" class="icon-btn small" data-i18n-title="popup.week.goNext"></button>
      </div>
    </div>
    <div class="week-legend" id="week-legend"></div>
    <div id="week-body"></div>
  </section>

  <details id="trash" class="trash" hidden>
    <summary class="section-label"></summary>
    <p class="note" data-i18n="popup.trash.note"></p>
    <ul id="trash-list" class="items"></ul>
  </details>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>

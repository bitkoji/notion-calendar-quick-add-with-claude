<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8182FF"/>
      <stop offset="1" stop-color="#5039D9"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A48F5"/>
      <stop offset="1" stop-color="#B03AE6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2B0E6E" flood-opacity="0.35"/>
    </filter>
    <clipPath id="card"><rect x="26" y="36" width="76" height="66" rx="15"/></clipPath>
  </defs>

  <!-- Background / 배경 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>

  <!-- Calendar card / 캘린더 카드 -->
  <g filter="url(#shadow)">
    <rect x="26" y="36" width="76" height="66" rx="15" fill="#fff"/>
  </g>
  <rect x="26" y="36" width="76" height="19" fill="#EEE9FF" clip-path="url(#card)"/>

  <!-- Binder rings / 바인더 링 -->
  <rect x="43" y="26" width="10" height="20" rx="5" fill="#fff"/>
  <rect x="75" y="26" width="10" height="20" rx="5" fill="#fff"/>
  <rect x="45.5" y="38" width="5" height="5" rx="2.5" fill="url(#ink)" opacity="0.35"/>
  <rect x="77.5" y="38" width="5" height="5" rx="2.5" fill="url(#ink)" opacity="0.35"/>

  <!-- Sparkle (natural language → event) / 반짝이 (자연어 → 일정) -->
  <path d="M60 62 C61.8 72 65 75.2 75 77 C65 78.8 61.8 82 60 92 C58.2 82 55 78.8 45 77 C55 75.2 58.2 72 60 62 Z" fill="url(#ink)"/>
  <path d="M81 64 C81.7 68 83 69.3 87 70 C83 70.7 81.7 72 81 76 C80.3 72 79 70.7 75 70 C79 69.3 80.3 68 81 64 Z" fill="url(#ink)" opacity="0.75"/>
</svg>
